schema_version: '0.1'
id: matmul_relu_matmul
tensors:
  x: {shape: [64, 64], dtype: bfloat16}
  w0: {shape: [64, 64], dtype: bfloat16}
  hidden: {shape: [64, 64], dtype: bfloat16}
  activated: {shape: [64, 64], dtype: bfloat16}
  w1: {shape: [64, 64], dtype: bfloat16}
  y: {shape: [64, 64], dtype: bfloat16}
inputs: [x, w0, w1]
outputs: [y]
ops:
  - {id: Matmul0, op: matmul, inputs: [x, w0], output: hidden}
  - {id: ReLU1, op: relu, inputs: [hidden], output: activated}
  - {id: Matmul2, op: matmul, inputs: [activated, w1], output: y}
edges:
  - {source: Matmul0, target: ReLU1, tensor: hidden, input_index: 0}
  - {source: ReLU1, target: Matmul2, tensor: activated, input_index: 0}
