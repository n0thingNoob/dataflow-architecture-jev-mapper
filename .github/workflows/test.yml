name: Program E2E
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-mapping-analyzer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Build pinned Wormhole TT-Sim
        working-directory: third_party/ttsim
        run: |
          test "$(git rev-parse HEAD)" = "$(git -C ../.. rev-parse HEAD:third_party/ttsim)"
          python make.py src/_out/release_wh/libttsim.so
          test -f src/_out/release_wh/libttsim.so

      - name: Unit and integration tests with coverage
        run: |
          coverage run --branch             --source=analyzer,candidate_generator,mapping_ir,pipeline,report,specs,tt_metal_probe,validator,workload             -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=75

      - run: python export_schemas.py

      - name: Tensor E2E
        run: python run_analyzer.py --program examples/gemm_relu_gemm.yaml --iterations 2 --output results/ci-tensor

      - name: Scalar diamond E2E
        run: python run_analyzer.py --program examples/scalar_diamond.yaml --inputs examples/scalar_diamond.inputs.json --parallel --iterations 2 --output results/ci-scalar

      - name: Candidate search E2E
        run: python run_analyzer.py --program examples/scalar_diamond.yaml --inputs examples/scalar_diamond.inputs.json --search --candidate-limit 8 --iterations 8 --output results/ci-search

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-e2e
          path: spatial-mapping-analyzer/results/


  tensix-real:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-dev-amd64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GitHub CLI and Python helpers
        run: |
          apt-get update
          apt-get install -y curl git gh python3-pip cmake ninja-build
          /usr/bin/python3 -m pip install pyyaml pydantic

      - name: Discover TT-Metal installation
        run: |
          set -euo pipefail
          version_file="$(find / -type f -path '*/tt_metal/ttsim-version' -print -quit 2>/dev/null || true)"
          if [[ -z "$version_file" ]]; then
            echo "::error::Cannot locate tt_metal/ttsim-version in official TT-Metal image"
            find / -maxdepth 5 -type f -iname '*metalium*config*.cmake' -print 2>/dev/null || true
            exit 1
          fi
          tt_metal_home="$(dirname "$(dirname "$version_file")")"
          echo "TT_METAL_HOME=$tt_metal_home" >> "$GITHUB_ENV"
          echo "TT_METAL_VERSION_FILE=$version_file" >> "$GITHUB_ENV"
          echo "Discovered TT_METAL_HOME=$tt_metal_home"

      - name: Fetch TT-Metal pinned Wormhole TT-Sim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "$TT_METAL_VERSION_FILE")"
          test -n "$version"
          mkdir -p "$GITHUB_WORKSPACE/.ci/ttsim"
          gh release download "$version" \
            --repo tenstorrent/ttsim \
            --pattern 'libttsim_wh.so' \
            --dir "$GITHUB_WORKSPACE/.ci/ttsim"
          mv "$GITHUB_WORKSPACE/.ci/ttsim/libttsim_wh.so" "$GITHUB_WORKSPACE/.ci/ttsim/libttsim.so"
          cp "$TT_METAL_HOME/tt_metal/soc_descriptors/wormhole_b0_80_arch.yaml" \
            "$GITHUB_WORKSPACE/.ci/ttsim/soc_descriptor.yaml"

      - name: Build and run real TT-Metal/TTSim placement probe
        run: bash spatial-mapping-analyzer/tensix_probe/run_real_ttsim.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tensix-real-probe
          path: spatial-mapping-analyzer/results/ci-tensix/
