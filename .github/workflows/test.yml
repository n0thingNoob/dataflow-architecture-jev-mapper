name: Passthrough E2E
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-mapping-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_analyzer.py --arch examples/wormhole.yaml --program examples/matmul_relu_matmul.yaml --iterations 10 --output results/ci-demo
